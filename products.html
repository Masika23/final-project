<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Minnie's Bakery</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <header>
    <h1>Our Products</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="products.html" class="active">Products</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Available Products</h2>

    
    <table class="product-table">
      <tr>
        <th>Product</th>
        <th>Price</th>
      </tr>
      <tr>
        <td>Chocolate Cake</td>
        <td>$10</td>
      </tr>
      <tr>
        <td>Croissant</td>
        <td>$3</td>
      </tr>
      <tr>
        <td>Strawberry Tart</td>
        <td>$6</td>
      </tr>
      <tr>
        <td>Baguette</td>
        <td>$4</td>
      </tr>
      <tr>
        <td>Bread</td>
        <td>$10</td>
      </tr>
      <tr>
        <td>Coffee</td>
        <td>$5</td>
      </tr>
      <tr>
        <td>Juice</td>
        <td>$12</td>
      </tr>
    </table>


    <h2>Place Your Order</h2>
    <form id="orderForm">
      <label for="name">Your Name:</label>
      <input type="text" id="name" required>

      <label for="product">Choose a Product:</label>
      <select id="product">
        <option value="Chocolate Cake">Chocolate Cake - $10</option>
        <option value="Croissant">Croissant - $3</option>
        <option value="Strawberry Tart">Strawberry Tart - $6</option>
        <option value="Baguette">Baguette - $4</option>
        <option value="Bread">Bread - $10</option>
        <option value="Coffee">Coffee - $5</option>
        <option value="Juice">Juice - $12</option>
      </select>

      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" min="1" value="1">

      <button type="submit">Order Now</button>
    </form>

    <div id="orderSummary"></div>
  </main>

  <footer>
    <p>&copy; 2025 Minnie's Bakery</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
